[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hm-treasury-voice-rag"
version = "0.1.0"
description = "A reproducible baseline for the Wiz AI voice RAG take-home assignment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "numpy>=2.0,<3.0",
  "openai>=2.0,<3.0",
  "pypdf>=6.0,<7.0",
  "rapidocr-onnxruntime==1.4.4",
  "pypdfium2>=4.30,<5",
  "python-multipart>=0.0.20,<1.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
